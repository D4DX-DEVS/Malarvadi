# DigitalOcean App Platform spec.
# Apply with:  doctl apps update <APP_ID> --spec .do/app.yaml
# or paste under App -> Settings -> App Spec in the console.
#
# The container listens on $PORT, which App Platform sets to http_port (8080).
# The npm start script reads it, so http_port and the app always agree.
name: malarvadi
region: blr
services:
  - name: web
    github:
      repo: D4DX-DEVS/Malarvadi
      branch: malarvadi-latest
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      # Secrets: set the real values in the console (or with `doctl`) so they
      # are stored encrypted. Nothing sensitive belongs in this file.
      - key: MONGODB_URI
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: AUTH_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: DO_SPACES_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DO_SPACES_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: DO_SPACES_REGION
        scope: RUN_TIME
        value: blr1
      - key: DO_SPACES_BUCKET
        scope: RUN_TIME
        value: ""
      - key: DO_SPACES_FOLDER
        scope: RUN_TIME
        value: uploads
      - key: DO_SPACES_CDN_URL
        scope: RUN_TIME
        value: ""
      - key: DO_SPACES_ENDPOINT
        scope: RUN_TIME
        value: ""
